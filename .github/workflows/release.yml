name: release

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "0.3.1"
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  INPUT_VERSION: ${{ inputs.version }}
  MIHOMO_LINUX_SHA256: 7F5983AE5ADA3F75884CAA45ADFB92FEC435D92ABF2BDE5DA1C55BACB2D35A74
  DASHBOARD_VERSION: v1.273.0
  DASHBOARD_SHA256: 076e05d2e3dc6641a0ec281aa4b97a18193fbcc379d139762c32d90adb22793c
  GEOIP_SHA256: 25357de43f4b93eba6eee7074fba5deddc2749eaf4d84ac03265d6ebf81a1955
  DEVELOPMENT_VERSION: 0.3.1
  MIHOMO_CORE_VERSION: v1.19.29-meshmux.2
  MIHOMO_CORE_SHA256: 0338285CFB7EC7C525D955387B14681B72D7B289730654ECD51A1F94BDAD5019
  MIHOMO_SOURCE_SHA256: 2EC7E147B84271811A8627FD8F8EC45C82DC18FED2E583D0B76851430C995B50

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go for MeshMux
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Install Linux tray dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libgtk-3-dev libayatana-appindicator3-dev

      - name: Resolve version
        shell: bash
        run: |
          version="$INPUT_VERSION"
          if [[ -z "$version" && "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ -z "$version" ]]; then
            version="$DEVELOPMENT_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release version" >&2; exit 1; }
          echo "MESHMUX_VERSION=$version" >> "$GITHUB_ENV"

      - name: Test MeshMux
        run: |
          go test ./...
          go vet ./...

      - name: Build Linux application bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/meshmux-linux"
          components="$RUNNER_TEMP/meshmux-components"
          archive="MeshMux-linux-amd64-v${MESHMUX_VERSION}.tar.gz"
          mkdir -p "$bundle/bin" "$components"

          go build -trimpath -ldflags "-s -w -X main.version=$MESHMUX_VERSION" -o "$bundle/meshmux" ./cmd/meshmux
          go build -trimpath -ldflags "-s -w -X main.version=$MESHMUX_VERSION" -o "$bundle/meshmux-tray" ./cmd/meshmux-tray

          core_source="mihomo-source-${MIHOMO_CORE_VERSION}.zip"
          curl --fail --location --retry 3 \
            --output "$components/$core_source" \
            "https://github.com/lumokato/MeshMux/releases/download/mihomo-${MIHOMO_CORE_VERSION}/${core_source}"
          echo "${MIHOMO_SOURCE_SHA256}  $components/$core_source" | sha256sum --check --strict
          core_binary="mihomo-linux-amd64-compatible-${MIHOMO_CORE_VERSION}.gz"
          curl --fail --location --retry 3 \
            --output "$components/$core_binary" \
            "https://github.com/lumokato/MeshMux/releases/download/mihomo-${MIHOMO_CORE_VERSION}/$core_binary"
          echo "${MIHOMO_LINUX_SHA256}  $components/$core_binary" | sha256sum --check --strict
          gzip -dc "$components/$core_binary" > "$bundle/bin/mihomo"
          chmod 755 "$bundle/bin/mihomo"
          "$bundle/bin/mihomo" -v

          curl --fail --location --retry 3 \
            --output "$bundle/bin/geoip.metadb" \
            "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb"

          echo "${GEOIP_SHA256}  $bundle/bin/geoip.metadb" | sha256sum --check --strict
          jq --arg version "$DASHBOARD_VERSION" --arg sha "$DASHBOARD_SHA256" \
            '.components.dashboard = {repo:"MetaCubeX/metacubexd",releaseTag:$version,assetPattern:"compressed-dist\\.tgz$",path:"dashboard",sha256:$sha}' \
            templates/meshmux.example.json > "$components/meshmux.local.json"
          "$bundle/meshmux" download dashboard -config "$components/meshmux.local.json"
          cp -a "$components/dashboard" "$bundle/dashboard"
          cp templates/meshmux.example.json "$bundle/meshmux.local.json"
          cp packaging/linux/meshmux.service packaging/linux/meshmux-web.service "$bundle/"
          cp packaging/linux/meshmux-tray.desktop packaging/linux/meshmux-sudoers "$bundle/"
          cp packaging/linux/README.release.md "$bundle/README-Linux.md"
          cp README.md README.en.md LICENSE SECURITY.md THIRD_PARTY_NOTICES.md "$bundle/"

          tar -C "$RUNNER_TEMP" -czf "$archive" meshmux-linux
          sha256sum "$archive" > "${archive}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: MeshMux-Linux-amd64
          path: |
            MeshMux-linux-amd64-v*.tar.gz
            MeshMux-linux-amd64-v*.tar.gz.sha256
          if-no-files-found: error

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go for MeshMux
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Resolve version
        shell: pwsh
        run: |
          $version = $env:INPUT_VERSION
          if (-not $version -and $env:GITHUB_REF -like "refs/tags/v*") {
            $version = $env:GITHUB_REF_NAME.TrimStart("v")
          }
          if (-not $version) {
            $version = $env:DEVELOPMENT_VERSION
          }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw "Invalid release version" }
          "MESHMUX_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build Go binaries
        shell: pwsh
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw "Go tests failed" }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw "Go vet failed" }
          if (Test-Path -LiteralPath build) { throw "build must be absent; archive prior outputs first" }
          if (Test-Path -LiteralPath release) { throw "release must be absent; archive prior outputs first" }
          New-Item -ItemType Directory -Force -Path build | Out-Null
          go build -ldflags "-H=windowsgui -s -w -X main.version=$env:MESHMUX_VERSION" -o build\MeshMux.exe .\cmd\meshmux-tray
          if ($LASTEXITCODE -ne 0) { throw "Tray build failed" }
          go build -ldflags "-s -w -X main.version=$env:MESHMUX_VERSION" -o build\meshmux-cli.exe .\cmd\meshmux
          if ($LASTEXITCODE -ne 0) { throw "CLI build failed" }

      - name: Prepare bundled components
        shell: pwsh
        run: |
          $repo = (Get-Location).Path
          $components = Join-Path $env:RUNNER_TEMP ("meshmux-components-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Force -Path build\bin,$components,(Join-Path $components "downloads") | Out-Null

          Push-Location $components
          $mihomoArchive = "mihomo-windows-amd64-compatible-$env:MIHOMO_CORE_VERSION.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/lumokato/MeshMux/releases/download/mihomo-$env:MIHOMO_CORE_VERSION/$mihomoArchive" `
            -OutFile $mihomoArchive `
            -UseBasicParsing
          $mihomoHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $mihomoArchive).Hash
          if ($mihomoHash -ne $env:MIHOMO_CORE_SHA256) {
            throw "Mihomo core checksum mismatch: $mihomoHash"
          }
          Expand-Archive -LiteralPath $mihomoArchive -DestinationPath mihomo -Force
          Copy-Item mihomo\mihomo-windows-amd64-compatible.exe "$repo\build\bin\mihomo.exe" -Force

          $geoip = "downloads\geoip.metadb"
          Invoke-WebRequest `
            -Uri "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb" `
            -OutFile $geoip `
            -UseBasicParsing
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $geoip).Hash -ne $env:GEOIP_SHA256) { throw "GeoIP checksum mismatch" }
          Copy-Item $geoip "$repo\build\bin\geoip.metadb" -Force

          $config = Get-Content -LiteralPath "$repo\templates\meshmux.example.json" -Raw | ConvertFrom-Json -AsHashtable
          $config.components = @{ dashboard = @{ repo = "MetaCubeX/metacubexd"; releaseTag = $env:DASHBOARD_VERSION; assetPattern = 'compressed-dist\.tgz$'; path = "dashboard"; sha256 = $env:DASHBOARD_SHA256 } }
          $config | ConvertTo-Json -Depth 30 | Set-Content -LiteralPath "$components\meshmux.local.json" -Encoding utf8
          & "$repo\build\meshmux-cli.exe" download dashboard -config "$components\meshmux.local.json"
          if ($LASTEXITCODE -ne 0) { throw "Dashboard download failed" }
          Copy-Item dashboard "$repo\build\dashboard" -Recurse -Force
          Pop-Location

          Copy-Item templates\meshmux.example.json build\meshmux.example.json -Force
          Copy-Item README.md build\README.md -Force
          Copy-Item SECURITY.md build\SECURITY.md -Force
          Copy-Item LICENSE build\LICENSE -Force
          Copy-Item THIRD_PARTY_NOTICES.md build\THIRD_PARTY_NOTICES.md -Force

      - name: Build installer
        shell: pwsh
        run: |
          ISCC.exe .\installer\MeshMux.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }

      - name: Write installer checksum
        shell: pwsh
        run: |
          Get-ChildItem release\*.exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii -NoNewline "$($_.FullName).sha256"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: MeshMux-Windows
          path: |
            release/*.exe
            release/*.exe.sha256
          if-no-files-found: error

  release:
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: MeshMux-*
          path: release-assets
          merge-multiple: true

      - name: Resolve version
        shell: bash
        run: echo "MESHMUX_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check --strict ./*.sha256
          test "$(find . -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MeshMux ${{ env.MESHMUX_VERSION }}
          body_path: release-notes.md
          files: release-assets/*
