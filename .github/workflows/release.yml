name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "0.3.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  MIHOMO_CORE_VERSION: v1.19.29-meshmux.1
  MIHOMO_CORE_SHA256: B0E8B3680726F314AC483DCB78C2A7D4193373DD88750884019A0A08352C281B

jobs:
  linux-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go for MeshMux
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Install Linux tray dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libgtk-3-dev libayatana-appindicator3-dev

      - name: Resolve version
        shell: bash
        run: |
          version="${{ github.event.inputs.version }}"
          if [[ -z "$version" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "MESHMUX_VERSION=$version" >> "$GITHUB_ENV"

      - name: Test and build Linux binaries
        run: |
          go test ./...
          go vet ./...
          go build -ldflags "-s -w -X main.version=$MESHMUX_VERSION" -o /tmp/meshmux ./cmd/meshmux
          go build -ldflags "-s -w -X main.version=$MESHMUX_VERSION" -o /tmp/meshmux-tray ./cmd/meshmux-tray

  windows:
    needs: linux-check
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go for MeshMux
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Resolve version
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          "MESHMUX_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build Go binaries
        shell: pwsh
        run: |
          go test ./...
          New-Item -ItemType Directory -Force -Path build | Out-Null
          go build -ldflags "-H=windowsgui -s -w -X main.version=$env:MESHMUX_VERSION" -o build\MeshMux.exe .\cmd\meshmux-tray
          go build -ldflags "-s -w -X main.version=$env:MESHMUX_VERSION" -o build\meshmux-cli.exe .\cmd\meshmux

      - name: Prepare bundled components
        shell: pwsh
        run: |
          $repo = (Get-Location).Path
          $components = Join-Path $env:RUNNER_TEMP "meshmux-components"
          Remove-Item -LiteralPath $components -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path build\bin,$components,(Join-Path $components "downloads") | Out-Null

          Push-Location $components
          $mihomoArchive = "mihomo-windows-amd64-compatible-$env:MIHOMO_CORE_VERSION.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/lumokato/MeshMux/releases/download/mihomo-$env:MIHOMO_CORE_VERSION/$mihomoArchive" `
            -OutFile $mihomoArchive `
            -UseBasicParsing
          $mihomoHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $mihomoArchive).Hash
          if ($mihomoHash -ne $env:MIHOMO_CORE_SHA256) {
            throw "Mihomo core checksum mismatch: $mihomoHash"
          }
          Expand-Archive -LiteralPath $mihomoArchive -DestinationPath mihomo -Force
          Copy-Item mihomo\mihomo-windows-amd64-compatible.exe "$repo\build\bin\mihomo.exe" -Force

          $geoip = "downloads\geoip.metadb"
          Invoke-WebRequest `
            -Uri "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb" `
            -OutFile $geoip `
            -UseBasicParsing
          Copy-Item $geoip "$repo\build\bin\geoip.metadb" -Force

          & "$repo\build\meshmux-cli.exe" download dashboard -config "$repo\templates\meshmux.example.json"
          Copy-Item dashboard "$repo\build\dashboard" -Recurse -Force
          Pop-Location

          Copy-Item templates\meshmux.example.json build\meshmux.example.json -Force
          Copy-Item README.md build\README.md -Force
          Copy-Item SECURITY.md build\SECURITY.md -Force
          Copy-Item LICENSE build\LICENSE -Force
          Copy-Item THIRD_PARTY_NOTICES.md build\THIRD_PARTY_NOTICES.md -Force

      - name: Build installer
        shell: pwsh
        run: ISCC.exe .\installer\MeshMux.iss

      - uses: actions/upload-artifact@v4
        with:
          name: MeshMux-Windows
          path: release/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: MeshMux ${{ env.MESHMUX_VERSION }}
          body: |
            MeshMux ${{ env.MESHMUX_VERSION }} 正式版。

            - Windows 核心改为登录前自动启动的系统服务，正常开机不再需要 UAC 确认。
            - Windows 服务使用受保护的运行快照，升级切换失败时自动恢复原用户核心。
            - 增加 Linux headless runner、loopback 配置服务、systemd 单元和 XFCE 托盘控制。
            - Linux 托盘支持核心、自启和桌面系统代理控制，退出托盘不停止核心。
            - 配置生成、运行态探测、下载与 Web 管理页适配 Windows/Linux 双平台。

            安装包内置 MeshMux 固定核心 `v1.19.29-meshmux.1`、geoip.metadb 和 MetaCubeXD。核心二进制与对应源码见 [固定核心资产](https://github.com/lumokato/MeshMux/releases/tag/mihomo-v1.19.29-meshmux.1)，第三方组件来源见 THIRD_PARTY_NOTICES.md。
          files: release/*.exe
