name: release

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "0.3.6"
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  INPUT_VERSION: ${{ inputs.version }}
  DASHBOARD_VERSION: v1.273.0
  DASHBOARD_SHA256: 076e05d2e3dc6641a0ec281aa4b97a18193fbcc379d139762c32d90adb22793c
  GEOIP_SHA256: 185CB54663CBC89D5325D5249AFDAE99DEF292A0EDD10539F8A05218A896602F
  DEVELOPMENT_VERSION: 0.3.6
  # Upstream mihomo. Record the exact asset hashes before publishing: download
  # the assets once, hash them, and fill the values in. The build fails on
  # purpose while they are empty rather than skipping checksum verification.
  #   https://github.com/MetaCubeX/mihomo/releases/tag/v1.19.30
  MIHOMO_UPSTREAM_VERSION: v1.19.30
  MIHOMO_UPSTREAM_WINDOWS_SHA256: ""
  MIHOMO_UPSTREAM_LINUX_SHA256: ""
  # Upstream tailscale rebuild: built from the official tag with no source
  # changes (see THIRD_PARTY_NOTICES.md). Upstream does not publish raw
  # tailscaled binaries for Windows and macOS, so MeshMux builds its own from
  # the same commit and records the version here.
  TAILSCALE_VERSION: v1.102.4
  WINTUN_VERSION: "0.14.1"
  # From https://www.wintun.net/ (build zip SHA-256). Required for the
  # windows tailscaled archive; empty means the build fails.
  WINTUN_SHA256: ""

jobs:
  tailscale-components:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go for the tailscale rebuild
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Resolve version
        shell: bash
        run: |
          version="$INPUT_VERSION"
          if [[ -z "$version" && "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ -z "$version" ]]; then
            version="$DEVELOPMENT_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release version" >&2; exit 1; }
          echo "MESHMUX_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build upstream tailscale binaries
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$TAILSCALE_VERSION" \
            https://github.com/tailscale/tailscale "$RUNNER_TEMP/ts-src"
          cd "$RUNNER_TEMP/ts-src"
          go mod download
          for target in "windows amd64" "linux amd64" "darwin amd64"; do
            set -- $target
            os="$1"; arch="$2"
            ext=""
            [[ "$os" == "windows" ]] && ext=".exe"
            out="$RUNNER_TEMP/tsbuild/$os-$arch"
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -o "$out/tailscaled$ext" ./cmd/tailscaled
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -o "$out/tailscale$ext" ./cmd/tailscale
            "$out/tailscaled$ext" --version || true
          done

      - name: Package per-platform tailscale archives
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/tsbuild"
          pkg="$RUNNER_TEMP/ts-packages"
          mkdir -p "$pkg"

          # Windows archive carries wintun.dll: tailscaled needs it beside the
          # executable for kernel-mode TUN.
          if [[ -z "$WINTUN_SHA256" ]]; then
            echo "WINTUN_SHA256 is empty; download" >&2
            echo "https://www.wintun.net/builds/wintun-${WINTUN_VERSION}.zip" >&2
            echo "hash it and record the value in the workflow env before publishing." >&2
            exit 1
          fi
          curl --fail --location --retry 3 \
            --output "$out/wintun.zip" \
            "https://www.wintun.net/builds/wintun-${WINTUN_VERSION}.zip"
          echo "${WINTUN_SHA256}  $out/wintun.zip" | sha256sum --check --strict
          unzip -q "$out/wintun.zip" -d "$out/wintun"
          cp "$out/wintun/wintun/bin/amd64/wintun.dll" "$out/windows-amd64/wintun.dll"

          winzip="tailscale-windows-amd64-${TAILSCALE_VERSION}.zip"
          (cd "$out/windows-amd64" && zip -q -r "$pkg/$winzip" tailscaled.exe tailscale.exe wintun.dll)
          lintar="tailscale-linux-amd64-${TAILSCALE_VERSION}.tar.gz"
          tar -C "$out/linux-amd64" -czf "$pkg/$lintar" tailscaled tailscale
          darzip="tailscale-darwin-amd64-${TAILSCALE_VERSION}.zip"
          (cd "$out/darwin-amd64" && zip -q -r "$pkg/$darzip" tailscaled tailscale)

          (cd "$pkg" && sha256sum --binary ./*.zip ./*.tar.gz > SHA256SUMS)
          mkdir -p "$RUNNER_TEMP/ts-unpacked"
          cp "$out/windows-amd64/tailscaled.exe" \
             "$out/windows-amd64/tailscale.exe" \
             "$out/windows-amd64/wintun.dll" \
             "$RUNNER_TEMP/ts-unpacked/"

      - uses: actions/upload-artifact@v4
        with:
          name: Tailscale-component-archives
          path: |
            ${{ runner.temp }}/ts-packages/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Tailscale-windows-unpacked
          path: |
            ${{ runner.temp }}/ts-unpacked/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    needs: [tailscale-components]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go for MeshMux
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Install Linux tray dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libgtk-3-dev libayatana-appindicator3-dev

      - name: Resolve version
        shell: bash
        run: |
          version="$INPUT_VERSION"
          if [[ -z "$version" && "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ -z "$version" ]]; then
            version="$DEVELOPMENT_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release version" >&2; exit 1; }
          echo "MESHMUX_VERSION=$version" >> "$GITHUB_ENV"

      - name: Test MeshMux
        run: |
          go test ./...
          go vet ./...

      - name: Build Linux application bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/meshmux-linux"
          components="$RUNNER_TEMP/meshmux-components"
          archive="MeshMux-linux-amd64-v${MESHMUX_VERSION}.tar.gz"
          mkdir -p "$bundle/bin" "$components"

          go build -trimpath -ldflags "-s -w -X main.version=$MESHMUX_VERSION" -o "$bundle/meshmux" ./cmd/meshmux
          go build -trimpath -ldflags "-s -w -X main.version=$MESHMUX_VERSION" -o "$bundle/meshmux-tray" ./cmd/meshmux-tray

          if [[ -z "$MIHOMO_UPSTREAM_LINUX_SHA256" ]]; then
            echo "MIHOMO_UPSTREAM_LINUX_SHA256 is empty; download" >&2
            echo "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_UPSTREAM_VERSION}/mihomo-linux-amd64-compatible-${MIHOMO_UPSTREAM_VERSION}.gz" >&2
            echo "hash it and record the value in the workflow env before publishing." >&2
            exit 1
          fi
          core_binary="mihomo-linux-amd64-compatible-${MIHOMO_UPSTREAM_VERSION}.gz"
          curl --fail --location --retry 3 \
            --output "$components/$core_binary" \
            "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_UPSTREAM_VERSION}/$core_binary"
          echo "${MIHOMO_UPSTREAM_LINUX_SHA256}  $components/$core_binary" | sha256sum --check --strict
          gzip -dc "$components/$core_binary" > "$bundle/bin/mihomo"
          chmod 755 "$bundle/bin/mihomo"
          "$bundle/bin/mihomo" -v

          curl --fail --location --retry 3 \
            --output "$bundle/bin/geoip.metadb" \
            "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb"

          echo "${GEOIP_SHA256}  $bundle/bin/geoip.metadb" | sha256sum --check --strict
          jq --arg version "$DASHBOARD_VERSION" --arg sha "$DASHBOARD_SHA256" \
            '.components.dashboard = {repo:"MetaCubeX/metacubexd",releaseTag:$version,assetPattern:"compressed-dist\\.tgz$",path:"dashboard",sha256:$sha}' \
            templates/meshmux.example.json > "$components/meshmux.local.json"
          "$bundle/meshmux" download dashboard -config "$components/meshmux.local.json"
          cp -a "$components/dashboard" "$bundle/dashboard"
          cp templates/meshmux.example.json "$bundle/meshmux.local.json"
          cp packaging/linux/meshmux.service packaging/linux/meshmux-web.service "$bundle/"
          cp packaging/linux/meshmux-tray.desktop packaging/linux/meshmux-sudoers "$bundle/"
          cp packaging/linux/README.release.md "$bundle/README-Linux.md"
          cp README.md README.en.md LICENSE SECURITY.md THIRD_PARTY_NOTICES.md "$bundle/"

          tar -C "$RUNNER_TEMP" -czf "$archive" meshmux-linux
          sha256sum "$archive" > "${archive}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: MeshMux-Linux-amd64
          path: |
            MeshMux-linux-amd64-v*.tar.gz
            MeshMux-linux-amd64-v*.tar.gz.sha256
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    needs: [tailscale-components]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go for MeshMux
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Resolve version
        shell: pwsh
        run: |
          $version = $env:INPUT_VERSION
          if (-not $version -and $env:GITHUB_REF -like "refs/tags/v*") {
            $version = $env:GITHUB_REF_NAME.TrimStart("v")
          }
          if (-not $version) {
            $version = $env:DEVELOPMENT_VERSION
          }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw "Invalid release version" }
          "MESHMUX_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build Go binaries
        shell: pwsh
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw "Go tests failed" }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw "Go vet failed" }
          if (Test-Path -LiteralPath build) { throw "build must be absent; archive prior outputs first" }
          if (Test-Path -LiteralPath release) { throw "release must be absent; archive prior outputs first" }
          New-Item -ItemType Directory -Force -Path build\bin | Out-Null
          go build -ldflags "-H=windowsgui -s -w -X main.version=$env:MESHMUX_VERSION" -o build\MeshMux.exe .\cmd\meshmux-tray
          if ($LASTEXITCODE -ne 0) { throw "Tray build failed" }
          go build -ldflags "-s -w -X main.version=$env:MESHMUX_VERSION" -o build\meshmux-cli.exe .\cmd\meshmux
          if ($LASTEXITCODE -ne 0) { throw "CLI build failed" }

      - name: Download tailscale components
        uses: actions/download-artifact@v4
        with:
          name: Tailscale-windows-unpacked
          path: build\bin

      - name: Prepare bundled components
        shell: pwsh
        run: |
          $repo = (Get-Location).Path
          $components = Join-Path $env:RUNNER_TEMP ("meshmux-components-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Force -Path $components,(Join-Path $components "downloads") | Out-Null

          if (-not $env:MIHOMO_UPSTREAM_WINDOWS_SHA256) {
            throw "MIHOMO_UPSTREAM_WINDOWS_SHA256 is empty; download https://github.com/MetaCubeX/mihomo/releases/download/$env:MIHOMO_UPSTREAM_VERSION/mihomo-windows-amd64-compatible-$env:MIHOMO_UPSTREAM_VERSION.zip, hash it and record the value in the workflow env before publishing."
          }
          Push-Location $components
          $mihomoArchive = "mihomo-windows-amd64-compatible-$env:MIHOMO_UPSTREAM_VERSION.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/MetaCubeX/mihomo/releases/download/$env:MIHOMO_UPSTREAM_VERSION/$mihomoArchive" `
            -OutFile $mihomoArchive `
            -UseBasicParsing
          $mihomoHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $mihomoArchive).Hash
          if ($mihomoHash -ne $env:MIHOMO_UPSTREAM_WINDOWS_SHA256) {
            throw "Mihomo core checksum mismatch: $mihomoHash"
          }
          Expand-Archive -LiteralPath $mihomoArchive -DestinationPath mihomo -Force
          Copy-Item mihomo\mihomo-windows-amd64-compatible.exe "$repo\build\bin\mihomo.exe" -Force

          $geoip = "downloads\geoip.metadb"
          Invoke-WebRequest `
            -Uri "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb" `
            -OutFile $geoip `
            -UseBasicParsing
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $geoip).Hash -ne $env:GEOIP_SHA256) { throw "GeoIP checksum mismatch" }
          Copy-Item $geoip "$repo\build\bin\geoip.metadb" -Force

          $config = Get-Content -LiteralPath "$repo\templates\meshmux.example.json" -Raw | ConvertFrom-Json -AsHashtable
          $config.components = @{ dashboard = @{ repo = "MetaCubeX/metacubexd"; releaseTag = $env:DASHBOARD_VERSION; assetPattern = 'compressed-dist\.tgz$'; path = "dashboard"; sha256 = $env:DASHBOARD_SHA256 } }
          $config | ConvertTo-Json -Depth 30 | Set-Content -LiteralPath "$components\meshmux.local.json" -Encoding utf8
          & "$repo\build\meshmux-cli.exe" download dashboard -config "$components\meshmux.local.json"
          if ($LASTEXITCODE -ne 0) { throw "Dashboard download failed" }
          Copy-Item dashboard "$repo\build\dashboard" -Recurse -Force
          Pop-Location

          Copy-Item templates\meshmux.example.json build\meshmux.example.json -Force
          Copy-Item README.md build\README.md -Force
          Copy-Item SECURITY.md build\SECURITY.md -Force
          Copy-Item LICENSE build\LICENSE -Force
          Copy-Item THIRD_PARTY_NOTICES.md build\THIRD_PARTY_NOTICES.md -Force

      - name: Build installer
        shell: pwsh
        run: |
          ISCC.exe .\installer\MeshMux.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }

      - name: Write installer checksum
        shell: pwsh
        run: |
          Get-ChildItem release\*.exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii -NoNewline "$($_.FullName).sha256"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: MeshMux-Windows
          path: |
            release/*.exe
            release/*.exe.sha256
          if-no-files-found: error

  release:
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    needs: [tailscale-components, linux, windows]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: "{MeshMux-*,Tailscale-*}"
          path: release-assets
          merge-multiple: true

      - name: Resolve version
        shell: bash
        run: echo "MESHMUX_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check --strict ./*.sha256
          test "$(find . -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Publication requires separate acceptance of the exact installer artifacts.
          draft: true
          name: MeshMux ${{ env.MESHMUX_VERSION }}
          body_path: release-notes.md
          files: release-assets/*
