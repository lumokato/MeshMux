name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "0.2.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go for mihomo
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Build patched mihomo
        shell: pwsh
        run: |
          .\scripts\build-mihomo.ps1 -OutputDir build\mihomo -PackageSource

      - name: Set up Go for MeshMux
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Resolve version
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          "MESHMUX_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build Go binaries
        shell: pwsh
        run: |
          go test ./...
          New-Item -ItemType Directory -Force -Path build | Out-Null
          go build -ldflags "-H=windowsgui -s -w -X main.version=$env:MESHMUX_VERSION" -o build\MeshMux.exe .\cmd\meshmux-tray
          go build -ldflags "-s -w -X main.version=$env:MESHMUX_VERSION" -o build\meshmux-cli.exe .\cmd\meshmux

      - name: Prepare bundled components
        shell: pwsh
        run: |
          $repo = (Get-Location).Path
          $components = Join-Path $env:RUNNER_TEMP "meshmux-components"
          Remove-Item -LiteralPath $components -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path build\bin,$components | Out-Null
          Copy-Item build\mihomo\mihomo-windows-amd64-compatible.exe build\bin\mihomo.exe -Force

          Push-Location $components
          $geoip = "downloads\geoip.metadb"
          Invoke-WebRequest `
            -Uri "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb" `
            -OutFile $geoip `
            -UseBasicParsing
          Copy-Item $geoip "$repo\build\bin\geoip.metadb" -Force

          & "$repo\build\meshmux-cli.exe" download dashboard -config "$repo\templates\meshmux.example.json"
          Copy-Item dashboard "$repo\build\dashboard" -Recurse -Force
          Pop-Location

          Copy-Item templates\meshmux.example.json build\meshmux.example.json -Force
          Copy-Item README.md build\README.md -Force
          Copy-Item SECURITY.md build\SECURITY.md -Force
          Copy-Item LICENSE build\LICENSE -Force
          Copy-Item THIRD_PARTY_NOTICES.md build\THIRD_PARTY_NOTICES.md -Force

      - name: Build installer
        shell: pwsh
        run: ISCC.exe .\installer\MeshMux.iss

      - uses: actions/upload-artifact@v4
        with:
          name: MeshMux-Windows
          path: |
            release/*.exe
            build/mihomo/*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: MeshMux ${{ env.MESHMUX_VERSION }}
          body: |
            MeshMux ${{ env.MESHMUX_VERSION }} 正式版。

            - 为 `type: tailscale` 增加通用 Tailnet TCP/UDP 入站端口转发。
            - 支持多条映射、配置校验、重载清理和停止时关闭全部 Tailnet 监听。
            - 默认关闭，不配置 `inboundForwards` 时保持原有行为。
            - 升级时安全同步安装包内置的补丁版 mihomo，同时保留显式自定义或已下载核心。

            安装包内置 MeshMux 补丁版 mihomo、geoip.metadb 和 MetaCubeXD。mihomo 二进制与对应源码包随 Release 发布，第三方组件来源见 THIRD_PARTY_NOTICES.md。
          files: |
            release/*.exe
            build/mihomo/*.zip
